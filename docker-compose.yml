services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secureops-platform:v1.0.0
    container_name: secureops-app
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=local-compose
      - APP_VERSION=v1.0.0
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: secureops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped
