apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-app-v2-canary
  namespace: secureops-prod
  labels:
    app: secureops-app
    track: canary
    version: v2.0.0
spec:
  replicas: 1  # 1 Canary pod against 3 Stable pods = 25% traffic split
  selector:
    matchLabels:
      app: secureops-app
      track: canary
  template:
    metadata:
      labels:
        app: secureops-app
        track: canary
        version: v2.0.0
    spec:
      containers:
        - name: web-app
          image: secureops-platform:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0.0-canary"
            - name: APP_ENV
              value: "canary-evaluation"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
